###############################################################################
# ePoints 生产环境 Nginx 配置
# 部署路径建议：/etc/nginx/sites-available/epoints
# 启用：sudo ln -sf /etc/nginx/sites-available/epoints /etc/nginx/sites-enabled/epoints
#       sudo nginx -t && sudo systemctl reload nginx
###############################################################################

server {
    listen 8080;
    server_name _;          # 改为实际域名，如 epoints.example.com

    # ─────────────────────────────────────────────────────────────
    # ① 关键修复：允许最大上传体积（头像/附件最大 20 MB，与后端保持一致）
    # Nginx 默认值仅 1MB，上传头像/商品图片时会返回 413 Request Entity Too Large
    # ─────────────────────────────────────────────────────────────
    client_max_body_size 20M;

    # 超时设置（文件上传可能耗时较长）
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;

    # ─────────────────────────────────────────────────────────────
    # ② API 反向代理 → NestJS :3000
    # ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 文件上传期间关闭缓冲，防止大文件超时
        proxy_request_buffering off;
    }

    # ─────────────────────────────────────────────────────────────
    # ③ 前端静态资源（Vite 构建产物）
    # ─────────────────────────────────────────────────────────────
    root /opt/epoints/dist;
    index index.html;

    # Vite 构建的 JS/CSS/图片等带 hash 的资源 → 强缓存 1 年
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA 路由回退 → 全部走 index.html（React Router）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
