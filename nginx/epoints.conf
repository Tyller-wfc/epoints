# ── HTTP 80: 重定向所有请求到 HTTPS ─────────────────────────────────────────
server {
    listen 80;
    server_name epoints.cn www.epoints.cn;

    # 强制 301 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS 443: 前端静态资源托管与后端 API 反向代理 ─────────────────────────
server {
    listen 443 ssl;
    server_name epoints.cn www.epoints.cn;

    # SSL 证书与私钥路径
    ssl_certificate /etc/nginx/cert/epoints.cn.pem;
    ssl_certificate_key /etc/nginx/cert/epoints.cn.key;

    # SSL 安全参数
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 前端静态资源托管
    root /opt/epoints/dist;
    index index.html;

    # 单页应用（SPA）路由回退支持，避免刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 NestJS API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
